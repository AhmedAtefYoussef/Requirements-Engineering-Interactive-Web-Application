<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Requirements Drafting Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CSEN406 Requirements Engineering study companion: lectures, interactive figures, flashcards, quizzes and glossary.">
<meta name="theme-color" content="#E6ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081630" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  (function () { try { var t = localStorage.getItem('re406:theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {} })();
</script>

</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Course">
    <a class="brand" href="#home" aria-label="Requirements Drafting Table, home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1.5" y="1.5" width="37" height="37" rx="4" fill="var(--accent)"/>
        <path d="M8 31 20 9l12 22" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12.5 23.5h15" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="9" r="2.6" fill="var(--accent-ink)"/>
      </svg>
      <div><b>Drafting Table</b><span>CSEN406 · Requirements Eng.</span></div>
    </a>
    <div class="nav-group" id="nav-main"></div>
    <div class="nav-group"><div class="nav-label">Sheets</div><div id="nav-lectures" style="display:grid;gap:2px"></div></div>
    <div class="nav-group" id="nav-tools"><div class="nav-label">Study tools</div></div>
    <div class="rail-foot">
      <p class="offline-note" id="offline-note">Loading offline support…</p>
    </div>
  </nav>
  <div class="rail-scrim" id="rail-scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open course menu" aria-controls="rail" aria-expanded="false"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <button class="search-btn" id="search-btn" aria-label="Search terms, sections and cards" aria-keyshortcuts="Control+K"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search the course</span><kbd>Ctrl K</kbd></button>
      <button class="icon-btn" id="theme-btn" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <g class="theme-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
          <g class="theme-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></g>
        </svg>
      </button>
    </header>
    <main class="view" id="view" tabindex="-1">
      <noscript><p>This study app needs JavaScript to run.</p></noscript>
    </main>
  </div>
</div>
<dialog class="palette" id="palette" aria-label="Search the course">
  <div class="pal-input">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="pal-q" type="search" placeholder="Search terms, sections, flashcards…" autocomplete="off" aria-controls="pal-results" aria-label="Search">
    <kbd>Esc</kbd>
  </div>
  <div class="pal-results" id="pal-results" role="listbox" aria-label="Results"></div>
  <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</dialog>
<div class="toasts" role="status" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/lecture.js"></script>
<script src="js/study.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
